version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies during install phase..."
      - npm install -g npm@latest

  pre_build:
    commands:
      - echo "Running pre-build tasks..."
      - echo "Login to Amazon ECR"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/bdt-arena
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - echo "Building Node.js application..."
      - cd backend && npm install && npm run build && cd ..
      - cd frontend && npm install && npm run build && cd ..

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
      - echo "Pushing Docker image to ECR..."
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "Writing image definitions file..."
      - printf '[{"name":"bdt-arena","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

  post_build:
    commands:
      - echo "Build completed on `date`"
      - echo "Creating application version..."

artifacts:
  files:
    - imagedefinitions.json
    - backend/dist/**/*
    - backend/migrations/**/*
    - frontend/dist/**/*
    - docker-compose.yml
    - Dockerfile
  name: BDTArenaArtifact

cache:
  paths:
    - 'backend/node_modules/**/*'
    - 'frontend/node_modules/**/*'

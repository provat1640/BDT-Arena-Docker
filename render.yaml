services:
  - type: web
    name: bdt-arena-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: PAYMENT_MODE
        value: sandbox
      - key: MARKET_MODE
        value: simulated
      - key: TZ
        value: Asia/Dhaka
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false

  - type: web
    name: bdt-arena-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_PUBLIC_BACKEND_URL
        sync: false
